<!doctype html>
<html lang="es-PE" class="is-loading">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Pantalla de carga solo al entrar desde fuera (o escribiendo la dirección), al recargar o al pulsar el logo.
      // Si se llega desde otra página del sitio (p. ej. el menú de /hosting/), se entra directo sin pantalla de carga.
      (function () {
        var html = document.documentElement
        if (!html.classList.contains('is-loading')) return
        var logo = false
        try { logo = sessionStorage.getItem('zc-loader') === '1'; sessionStorage.removeItem('zc-loader') } catch (e) {}
        var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0]
        var recarga = nav && nav.type === 'reload'
        var desdeElSitio = false
        try { desdeElSitio = !!document.referrer && new URL(document.referrer).origin === location.origin } catch (e) {}
        if (desdeElSitio && !logo && !recarga) html.classList.remove('is-loading')
      })()
    </script>

    <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-G18T50NGYE"></script>
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag(){dataLayer.push(arguments)}
      gtag('js', new Date())
      gtag('config', 'G-G18T50NGYE')

      // Conversiones: avisa a Analytics cuando alguien pulsa WhatsApp o "Cotizar".
      document.addEventListener('click', function (e) {
        var el = e.target.closest && e.target.closest('a, button')
        if (!el) return
        var href = (el.getAttribute && el.getAttribute('href')) || ''
        var texto = (el.textContent || '').toLowerCase()
        if (/wa\.me|api\.whatsapp|whatsapp/i.test(href)) {
          gtag('event', 'contacto_whatsapp', { metodo: 'whatsapp' })
        } else if (texto.indexOf('cotiza') !== -1) {
          gtag('event', 'click_cotizar', { ubicacion: 'web' })
        }
      })
    </script>
